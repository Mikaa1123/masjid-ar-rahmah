    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #FAFAF7;
            color: #1F2933;
        }



        /* ==========================================================
           HEADER
        ========================================================== */

        .site-header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;

            position: sticky;
            top: 0;
            z-index: 100;
        }


        .header-inner {
            max-width: 1100px;

            margin: 0 auto;

            padding: 14px 22px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 30px;
        }


        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .site-logo {
            width: 54px;
            height: 54px;

            object-fit: contain;
        }


        .brand-name {
            color: #075C2A;

            font-size: 18px;
            font-weight: 800;
        }


        .brand-location {
            color: #5B6570;
            font-size: 13px;
        }


        .main-nav {
            display: flex;
            gap: 24px;
        }


        .main-nav a {
            color: #1F2933;

            text-decoration: none;

            font-weight: 700;
        }


        .main-nav a:hover {
            color: #087A35;
        }



        /* ==========================================================
           PAGE
        ========================================================== */

        .page-container {
            max-width: 900px;

            margin: 40px auto;

            padding: 0 20px;
        }


        .back-link {
            display: inline-block;

            margin-bottom: 20px;

            color: #087A35;

            text-decoration: none;

            font-weight: 700;
        }


        .back-link:hover {
            color: #075C2A;
        }



        /* ==========================================================
           KUTIPAN SECTION
        ========================================================== */

        .kutipan-section {
            background: #ffffff;

            border-radius: 20px;

            border-top: 6px solid #C9A227;

            padding: 38px 28px;

            box-shadow:
                0 8px 28px rgba(0, 0, 0, 0.08);
        }


        .kutipan-header {
            text-align: center;

            margin-bottom: 30px;
        }


        .kutipan-decoration {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 15px;

            margin-bottom: 8px;
        }


        .kutipan-decoration span {
            width: 110px;
            height: 1px;

            background: #d7c37a;
        }


        .kutipan-icon {
            font-size: 27px;
        }


        .kutipan-header h1 {
            color: #075C2A;

            font-size: 32px;

            margin: 5px 0 8px;
        }


        .kutipan-header p {
            color: #5B6570;

            font-size: 17px;

            line-height: 1.6;

            margin: 0;
        }



        /* ==========================================================
           LATEST COLLECTION
        ========================================================== */

        .kutipan-card {
            background:
                linear-gradient(
                    135deg,
                    #f9fcf8,
                    #fffdf4
                );

            border: 1px solid #e5eadf;

            border-radius: 18px;

            padding: 42px 25px;

            text-align: center;
        }


        .kutipan-label {
            color: #5B6570;

            font-size: 14px;
            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            margin-bottom: 12px;
        }


        .kutipan-amount {
            color: #087A35;

            font-size: 48px;
            font-weight: 800;

            margin-bottom: 12px;
        }


        .kutipan-date {
            color: #5B6570;

            font-size: 17px;

            line-height: 1.6;
        }


        .kutipan-date strong {
            color: #075C2A;
        }


        .kutipan-note {
            max-width: 600px;

            margin: 30px auto 0;

            padding-top: 22px;

            border-top: 1px solid #dce6dd;

            color: #5B6570;

            font-size: 15px;

            line-height: 1.7;
        }



        /* ==========================================================
           PREVIOUS COLLECTIONS
        ========================================================== */

        .history-section {
            margin-top: 38px;
        }


        .history-heading {
            margin-bottom: 18px;
        }


        .history-heading h2 {
            color: #075C2A;

            font-size: 24px;

            margin: 0 0 6px;
        }


        .history-heading p {
            color: #5B6570;

            font-size: 15px;

            margin: 0;

            line-height: 1.6;
        }


        .history-list {
            display: flex;
            flex-direction: column;

            gap: 10px;
        }


        .history-item {
            background: #FAFAF7;

            border: 1px solid #e4e9e5;

            border-radius: 12px;

            padding: 16px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }


        .history-date {
            display: flex;
            align-items: center;

            gap: 10px;

            color: #1F2933;

            font-size: 16px;
            font-weight: 700;
        }


        .history-icon {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border-radius: 50%;

            background: #eaf4ed;

            font-size: 18px;
        }


        .history-amount {
            color: #087A35;

            font-size: 18px;
            font-weight: 800;

            white-space: nowrap;
        }



        /* ==========================================================
           EMPTY / ERROR
        ========================================================== */

        .message {
            text-align: center;

            color: #5B6570;

            line-height: 1.6;
        }


        .error-message {
            text-align: center;

            color: #9B1C1C;

            line-height: 1.6;
        }



        /* ==========================================================
           MOBILE
        ========================================================== */

        @media (max-width: 700px) {

            .header-inner {
                padding: 12px 16px;
            }


            .main-nav {
                display: none;
            }


            .site-logo {
                width: 46px;
                height: 46px;
            }


            .brand-name {
                font-size: 16px;
            }


            .page-container {
                margin: 25px auto;

                padding: 0 16px;
            }


            .kutipan-section {
                padding: 28px 16px;
            }


            .kutipan-header h1 {
                font-size: 27px;
            }


            .kutipan-decoration span {
                width: 65px;
            }


            .kutipan-card {
                padding: 32px 18px;
            }


            .kutipan-amount {
                font-size: 39px;
            }


            .history-heading h2 {
                font-size: 21px;
            }


            .history-item {
                padding: 15px;

                align-items: flex-start;
            }


            .history-date {
                font-size: 15px;
            }


            .history-amount {
                font-size: 16px;
            }

        }



        @media (max-width: 480px) {

            .history-item {
                flex-direction: column;

                gap: 10px;
            }


            .history-amount {
                margin-left: 50px;
            }

        }


        /* ==========================================================
                         HISTORY BUTTON
        ========================================================== */

.history-actions {
    margin-top: 22px;
    text-align: center;
}


.history-button {
    min-height: 48px;

    padding: 12px 24px;

    border: 2px solid #087A35;
    border-radius: 10px;

    background: #ffffff;
    color: #087A35;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;
}


.history-button:hover {
    background: #087A35;
    color: #ffffff;
}


.history-button:focus-visible {
    outline: 3px solid #C9A227;
    outline-offset: 3px;
}


        /* =========================
           MOBILE BOTTOM NAVIGATION
           ========================= */

        .mobile-bottom-nav,
        .mobile-more-menu {
            display: none;
        }

        @media (max-width: 700px) {
            body {
                padding-bottom: 88px;
            }

            .mobile-bottom-nav {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 9999;
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                background: #ffffff;
                border-top: 1px solid #dfe7e2;
                box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.08);
            }

            .mobile-bottom-nav a,
            .mobile-bottom-nav button {
                min-height: 68px;
                padding: 8px 4px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 3px;
                border: none;
                background: transparent;
                color: #5B6570;
                font: inherit;
                font-size: 12px;
                font-weight: 700;
                text-decoration: none;
                cursor: pointer;
            }

            .mobile-bottom-nav .nav-icon {
                font-size: 22px;
                line-height: 1;
            }

            .mobile-bottom-nav a.active,
            .mobile-bottom-nav button.active {
                color: #087A35;
                background: #F1F8F3;
            }

            .mobile-bottom-nav a:hover,
            .mobile-bottom-nav button:hover,
            .mobile-bottom-nav a:focus-visible,
            .mobile-bottom-nav button:focus-visible {
                color: #087A35;
                background: #F1F8F3;
                outline: none;
            }

            .mobile-more-menu {
                position: fixed;
                left: 14px;
                right: 14px;
                bottom: 80px;
                z-index: 9998;
                background: #ffffff;
                border: 1px solid #dfe7e2;
                border-radius: 18px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
                padding: 10px;
            }

            .mobile-more-menu.open {
                display: grid;
                grid-template-columns: 1fr 1fr;

            }

            .mobile-more-menu a {

            }

            .mobile-more-menu a:hover,
            .mobile-more-menu a:focus-visible {
                background: #EAF5ED;
                outline: none;
            }
        }

    </style>

</head>

<!-- ==========================================================
     JAVASCRIPT
========================================================== -->

<script>


/*
==========================================================
API
==========================================================
*/

const API_URL =
    "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnT3hjjtmDgiAI95TcthDeoUg2YAfEwkIDs7yxlogxCUrheduEDFc52P8QdBcbPk17iUqSbySPPQjMn4D6cOuWoF3yDq0ViW5vaIPJAiRi4htooArJ9geD5ZlmaTp_Q8aq0Kxc-1WS4ymxC8pW5IFO7Vc75jpnM7WBRj5wnWEI-EIdnyTl30QDApXiE9gVEJCbjkCN2wxNT6LmuDS2pg064qtiZQKzohQpxm1WD_fj15wGOMG7c_IstTsiUAVylPZl5t2Iiv_jJ2tlcrRpGmvs0yGLCxzw&lib=MJE8yEfkfGXi95HyhXqmG7zPvk22uQMVR";



/*
==========================================================
FORMAT DATE
==========================================================
*/

function formatDate(dateString) {

    if (!dateString) {
        return "-";
    }


    const date =
        new Date(
            dateString + "T00:00:00"
        );


    if (Number.isNaN(date.getTime())) {
        return dateString;
    }


    return date.toLocaleDateString(
        "ms-MY",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}



/*
==========================================================
FORMAT MONEY
==========================================================
*/

function formatMoney(value) {

    const number =
        Number(value);


    if (Number.isNaN(number)) {
        return "RM0.00";
    }


    return number.toLocaleString(
        "ms-MY",
        {
            style: "currency",
            currency: "MYR"
        }
    );

}



/*
==========================================================
DATE FOR SORTING
==========================================================
*/

function getDateValue(dateString) {

    if (!dateString) {
        return 0;
    }


    const date =
        new Date(
            dateString + "T00:00:00"
        );


    const time =
        date.getTime();


    return Number.isNaN(time)
        ? 0
        : time;

}



/*
==========================================================
LOAD KUTIPAN
==========================================================
*/

async function loadKutipan() {


    const container =
        document.getElementById(
            "kutipan-data"
        );


    try {


        /*
        ------------------------------
        GET DATA
        ------------------------------
        */

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "Gagal mendapatkan data kutipan."
            );

        }


        const data =
            await response.json();



        /*
        ------------------------------
        CHECK DATA
        ------------------------------
        */

        if (
            !data.success ||
            !Array.isArray(data.kutipan) ||
            data.kutipan.length === 0
        ) {

            container.innerHTML = `

                <p class="message">

                    Tiada maklumat kutipan
                    yang diterbitkan.

                </p>

            `;

            return;

        }



        /*
        ------------------------------
        SORT NEWEST FIRST
        ------------------------------

        We sort here as an extra safety measure,
        even if Apps Script already returns the
        records in the correct order.
        */

        const collections =
            [...data.kutipan]
                .sort(
                    (a, b) =>
                        getDateValue(b.tarikh) -
                        getDateValue(a.tarikh)
                );



        /*
        ------------------------------
        LATEST COLLECTION
        ------------------------------
        */

        const latest =
            collections[0];


        const latestAmount =
            formatMoney(
                latest.jumlah
            );


        const latestDate =
            formatDate(
                latest.tarikh
            );



        /*
        ------------------------------
        PREVIOUS COLLECTIONS
        ------------------------------
        */

        const previous =
        collections.slice(1);

        const INITIAL_RECORDS = 5;

        const recentPrevious =
        previous.slice(0, INITIAL_RECORDS);


        const historyHTML =
    previous.length > 0
        ? `

            <div class="history-section">

                <div class="history-heading">

                    <h2>
                        Rekod Kutipan Terdahulu
                    </h2>

                    <p>
                        Rekod kutipan Jumaat yang telah
                        disahkan dan diterbitkan.
                    </p>

                </div>


                <div
                    class="history-list"
                    id="historyList"
                >

                    ${recentPrevious.map(item => `

                        <div class="history-item">

                            <div class="history-date">

                                <div class="history-icon">
                                    📅
                                </div>

                                <span>
                                    ${formatDate(item.tarikh)}
                                </span>

                            </div>


                            <div class="history-amount">
                                ${formatMoney(item.jumlah)}
                            </div>

                        </div>

                    `).join("")}

                </div>


                ${
                    previous.length > INITIAL_RECORDS
                        ? `
                            <div class="history-actions">

                                <button
                                    type="button"
                                    id="toggleHistoryButton"
                                    class="history-button"
                                >
                                    Lihat Semua Rekod
                                </button>

                            </div>
                        `
                        : ""
                }

            </div>

        `
        : "";



        /*
        ------------------------------
        DISPLAY
        ------------------------------
        */

        container.innerHTML = `


            <article class="kutipan-card">


                <div class="kutipan-label">

                    Jumlah Kutipan Terkini

                </div>



                <div class="kutipan-amount">

                    ${latestAmount}

                </div>



                <div class="kutipan-date">

                    Kutipan pada

                    <strong>

                        ${latestDate}

                    </strong>

                </div>



                <div class="kutipan-note">

                    Jumlah yang dipaparkan merupakan
                    jumlah kutipan yang telah disahkan
                    oleh pihak pengurusan
                    Masjid Ar-Rahmah Sarikei.

                </div>


            </article>



            ${historyHTML}

        `;
        const toggleButton =
    document.getElementById(
        "toggleHistoryButton"
    );

const historyList =
    document.getElementById(
        "historyList"
    );


if (toggleButton && historyList) {

    let showingAll = false;


    toggleButton.addEventListener(
        "click",
        function () {

            showingAll = !showingAll;


            const recordsToShow =
                showingAll
                    ? previous
                    : recentPrevious;


            historyList.innerHTML =
                recordsToShow.map(item => `

                    <div class="history-item">

                        <div class="history-date">

                            <div class="history-icon">
                                📅
                            </div>

                            <span>
                                ${formatDate(item.tarikh)}
                            </span>

                        </div>


                        <div class="history-amount">
                            ${formatMoney(item.jumlah)}
                        </div>

                    </div>

                `).join("");


            toggleButton.textContent =
                showingAll
                    ? "Tunjukkan Sedikit"
                    : "Lihat Semua Rekod";

        }
    );

}


    } catch (error) {


        console.error(
            "Kutipan error:",
            error
        );


        container.innerHTML = `

            <p class="error-message">

                Maklumat kutipan tidak dapat
                dimuatkan buat masa ini.

            </p>

        `;


    }


}



/*
==========================================================
START
==========================================================
*/

loadKutipan();


</script>



<script>
const mobileMoreButton = document.getElementById("mobileMoreButton");
const mobileMoreMenu = document.getElementById("mobileMoreMenu");

mobileMoreButton.addEventListener("click", () => {
    const isOpen = mobileMoreMenu.classList.toggle("open");
    mobileMoreButton.setAttribute("aria-expanded", isOpen);
});

document.addEventListener("click", (event) => {
    const clickedInsideMenu = mobileMoreMenu.contains(event.target);
    const clickedButton = mobileMoreButton.contains(event.target);

    if (!clickedInsideMenu && !clickedButton) {
        mobileMoreMenu.classList.remove("open");
        mobileMoreButton.setAttribute("aria-expanded", "false");
    }
});
</script>

</body>
