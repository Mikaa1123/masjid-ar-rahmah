<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Berita Kematian | Masjid Ar-Rahmah Sarikei</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #FAFAF7;
            color: #1F2933;
            margin: 0;
        }

        .site-header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 14px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .site-logo {
            width: 54px;
            height: 54px;
            object-fit: contain;
        }

        .brand-name {
            color: #075C2A;
            font-size: 18px;
            font-weight: 800;
        }

        .brand-location {
            color: #5B6570;
            font-size: 13px;
        }

        .main-nav {
            display: flex;
            gap: 24px;
        }

        .main-nav a {
            color: #1F2933;
            text-decoration: none;
            font-weight: 700;
        }

        .main-nav a:hover {
            color: #087A35;
        }

        .page-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #087A35;
            text-decoration: none;
            font-weight: 700;
        }

        .kematian-section {
            background: #ffffff;
            padding: 38px 28px 30px;
            border-radius: 20px;
            border-top: 6px solid #087A35;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        .kematian-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .kematian-header-decoration {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 8px;
        }

        .kematian-header-decoration span {
            width: 110px;
            height: 1px;
            background: #87ad98;
        }

        .mosque-icon {
            color: #075C2A;
            font-size: 25px;
        }

        .kematian-header h1 {
            color: #075C2A;
            font-size: 32px;
            margin: 5px 0;
        }

        .kematian-header p {
            color: #5B6570;
            font-size: 17px;
        }

        .kematian-announcement {
            background: linear-gradient(135deg,#f3faf5,#f8fbf8);
            border: 1px solid #e1eee5;
            border-radius: 16px;
            padding: 36px;
            text-align: center;
        }

        .innalillah {
            direction: rtl;
            font-family: serif;
            color: #075C2A;
            font-size: 28px;
            margin-bottom: 24px;
        }

        .kematian-label {
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #5B6570;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .nama-arwah {
            color: #075C2A;
            font-size: 32px;
            font-weight: 700;
            text-transform: capitalize;
        }

        .umur-arwah {
            color: #5B6570;
            font-size: 17px;
            margin: 6px 0 24px;
        }

        .meninggal-info {
            font-size: 17px;
            color: #5B6570;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .meninggal-info strong {
            display: block;
            color: #075C2A;
            font-size: 20px;
        }

        .kematian-divider {
            width: 55%;
            height: 1px;
            background: #cbded1;
            margin: 25px auto;
        }

        .jenazah-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .detail-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background: #e3f0e7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .detail-label {
            color: #5B6570;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .detail-value {
            color: #075C2A;
            font-size: 17px;
            font-weight: 700;
        }

        .pengebumian-box {
            background: #eaf4ed;
            border-radius: 12px;
            padding: 18px 22px;
            margin-top: 20px;
        }

        .kematian-doa {
            border-top: 1px solid #d6e5da;
            margin-top: 24px;
            padding-top: 22px;
            color: #5B6570;
            line-height: 1.7;
        }

        @media (max-width: 700px) {
            .main-nav {
                display: none;
            }

            .jenazah-details {
                grid-template-columns: 1fr;
            }

            .kematian-section {
                padding: 26px 16px;
            }
        }


        /* ==========================================================
   WHATSAPP COPY
========================================================== */

.whatsapp-actions {
    margin-top: 24px;
    text-align: center;
}

.copy-whatsapp-button {
    border: none;
    background: #087A35;
    color: #ffffff;

    padding: 14px 22px;
    border-radius: 10px;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;
    min-height: 48px;
}

.copy-whatsapp-button:hover {
    background: #075C2A;
}

.copy-whatsapp-button:active {
    transform: scale(0.98);
}

.copy-status {
    margin-top: 10px;
    min-height: 20px;

    color: #087A35;
    font-size: 14px;
    font-weight: 700;
}


        /* =========================
           MOBILE BOTTOM NAVIGATION
           ========================= */

        .mobile-bottom-nav,
        .mobile-more-menu {
            display: none;
        }

        @media (max-width: 700px) {
            body {
                padding-bottom: 88px;
            }

            .mobile-bottom-nav {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 9999;

                display: grid;
                grid-template-columns: repeat(4, 1fr);

                background: #ffffff;
                border-top: 1px solid #dfe7e2;
                box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.08);
            }

            .mobile-bottom-nav a,
            .mobile-bottom-nav button {
                min-height: 68px;
                padding: 8px 4px;

                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 3px;

                border: none;
                background: transparent;
                color: #5B6570;

                font: inherit;
                font-size: 12px;
                font-weight: 700;
                text-decoration: none;
                cursor: pointer;
            }

            .mobile-bottom-nav .nav-icon {
                font-size: 22px;
                line-height: 1;
            }

            .mobile-bottom-nav a.active,
            .mobile-bottom-nav button.active {
                color: #087A35;
                background: #F1F8F3;
            }

            .mobile-bottom-nav a:hover,
            .mobile-bottom-nav button:hover,
            .mobile-bottom-nav a:focus-visible,
            .mobile-bottom-nav button:focus-visible {
                color: #087A35;
                background: #F1F8F3;
                outline: none;
            }

            .mobile-more-menu {
                position: fixed;
                left: 14px;
                right: 14px;
                bottom: 80px;
                z-index: 9998;

                background: #ffffff;
                border: 1px solid #dfe7e2;
                border-radius: 18px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
                padding: 10px;
            }

            .mobile-more-menu.open {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .mobile-more-menu a {
                min-height: 54px;
                padding: 12px;

                display: flex;
                align-items: center;

                border-radius: 12px;
                background: #FAFAF7;

                color: #075C2A;
                font-weight: 700;
                text-decoration: none;
            }

            .mobile-more-menu a.current {
                background: #EAF5ED;
                box-shadow: inset 0 0 0 1px #b9dcc5;
            }

            .mobile-more-menu a:hover,
            .mobile-more-menu a:focus-visible {
                background: #EAF5ED;
                outline: none;
            }
        }

    </style>
</head>

<body>

<header class="site-header">
    <div class="header-inner">

        <div class="brand">
            <img src="logo.png"
                 class="site-logo"
                 alt="Logo Masjid Ar-Rahmah Sarikei">

            <div>
                <div class="brand-name">
                    Masjid Ar-Rahmah Sarikei
                </div>

                <div class="brand-location">
                    Sarikei, Sarawak
                </div>
            </div>
        </div>

        <nav class="main-nav">
            <a href="index.html">Utama</a>
            <a href="kematian.html">Kematian</a>
            <a href="kutipan.html">Kutipan</a>
            <a href="pengumuman.html">Pengumuman</a>
        </nav>

    </div>
</header>

<main class="page-container">

    <a href="index.html" class="back-link">
        ← Kembali ke Utama
    </a>

    <section class="kematian-section">

        <div class="kematian-header">

            <div class="kematian-header-decoration">
                <span></span>
                <div class="mosque-icon">☪</div>
                <span></span>
            </div>

            <h1>Berita Kematian</h1>

            <p>
                Maklumat kematian dan urusan jenazah
                Masjid Ar-Rahmah Sarikei
            </p>

        </div>

        <div id="kematian-data">
            Memuatkan maklumat...
        </div>

    </section>

</main>


<nav class="mobile-bottom-nav" aria-label="Navigasi mudah alih">
    <a href="index.html">
        <span class="nav-icon">🏠</span>
        <span>Utama</span>
    </a>

    <a href="pengumuman.html">
        <span class="nav-icon">📣</span>
        <span>Pengumuman</span>
    </a>

    <a href="aktiviti.html">
        <span class="nav-icon">📅</span>
        <span>Aktiviti</span>
    </a>

    <button
        type="button"
        id="mobileMoreButton"
        class="active"
        aria-expanded="false"
        aria-controls="mobileMoreMenu"
    >
        <span class="nav-icon">☰</span>
        <span>Lagi</span>
    </button>
</nav>

<div class="mobile-more-menu" id="mobileMoreMenu">
    <a href="kematian.html" class="current" aria-current="page">🕊️ Kematian</a>
    <a href="kutipan.html">💰 Kutipan</a>
    <a href="index.html#sumbangan">🤲 Sumbangan</a>
    <a href="index.html#maklumat-masjid">📍 Maklumat Masjid</a>
</div>


<script>

const API_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnT3hjjtmDgiAI95TcthDeoUg2YAfEwkIDs7yxlogxCUrheduEDFc52P8QdBcbPk17iUqSbySPPQjMn4D6cOuWoF3yDq0ViW5vaIPJAiRi4htooArJ9geD5ZlmaTp_Q8aq0Kxc-1WS4ymxC8pW5IFO7Vc75jpnM7WBRj5wnWEI-EIdnyTl30QDApXiE9gVEJCbjkCN2wxNT6LmuDS2pg064qtiZQKzohQpxm1WD_fj15wGOMG7c_IstTsiUAVylPZl5t2Iiv_jJ2tlcrRpGmvs0yGLCxzw&lib=MJE8yEfkfGXi95HyhXqmG7zPvk22uQMVR";

async function loadKematian() {

    const element =
        document.getElementById("kematian-data");

    try {

        const response = await fetch(API_URL);
        const data = await response.json();

        if (
            !data.success ||
            !data.kematian ||
            data.kematian.length === 0
        ) {
            element.innerHTML =
                "<p style='text-align:center;'>Tiada berita kematian yang diterbitkan.</p>";
            return;
        }

        const latest = data.kematian[0];

        function formatDate(dateString) {

            if (!dateString) return "-";

            return new Date(
                dateString + "T00:00:00"
            ).toLocaleDateString(
                "ms-MY",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );
        }

        const umur =
            latest.umur
                ? `${latest.umur} tahun`
                : "";

        element.innerHTML = `
            <article class="kematian-announcement">

                <div class="innalillah">
                    إنا لله وإنا إليه راجعون
                </div>

                <div class="kematian-label">
                    Dukacita dimaklumkan bahawa
                </div>

                <div class="nama-arwah">
                    ${latest.nama || "-"}
                </div>

                ${
                    umur
                    ? `
                    <div class="umur-arwah">
                        Berumur ${umur}
                    </div>
                    `
                    : ""
                }

                <div class="meninggal-info">
                    Telah kembali ke rahmatullah pada

                    <strong>
                        ${formatDate(latest.tarikhMeninggal)}
                        ${
                            latest.masaMeninggal
                            ? `, jam ${latest.masaMeninggal}`
                            : ""
                        }
                    </strong>
                </div>

                <div class="kematian-divider"></div>

                <div class="jenazah-details">

                    <div>
                        <div class="detail-icon">📅</div>
                        <div class="detail-label">
                            Tarikh Solat Jenazah
                        </div>
                        <div class="detail-value">
                            ${formatDate(latest.tarikhSolat)}
                        </div>
                    </div>

                    <div>
                        <div class="detail-icon">🕐</div>
                        <div class="detail-label">
                            Masa Solat Jenazah
                        </div>
                        <div class="detail-value">
                            ${latest.masaSolat || "-"}
                        </div>
                    </div>

                    <div>
                        <div class="detail-icon">🕌</div>
                        <div class="detail-label">
                            Tempat Solat Jenazah
                        </div>
                        <div class="detail-value">
                            ${latest.tempatSolat || "-"}
                        </div>
                    </div>

                </div>

                ${
                    latest.tempatPengebumian
                    ? `
                    <div class="pengebumian-box">

                        <div class="detail-label">
                            📍 Tempat Pengebumian
                        </div>

                        <div class="detail-value">
                            ${latest.tempatPengebumian}
                        </div>

                    </div>
                    `
                    : ""
                }

                <div class="kematian-doa">

                    Semoga Allah SWT mengampuni dan merahmati
                    ${
                        latest.jantina === "Perempuan"
                            ? "Allahyarhamah"
                            : "Allahyarham"
                    }
                    serta menempatkannya dalam kalangan
                    orang-orang yang beriman.

                </div>

                <div class="whatsapp-actions">

    <button
        type="button"
        class="copy-whatsapp-button"
        id="copyWhatsAppButton"
    >
        📋 Salin untuk WhatsApp
    </button>

    <div
        class="copy-status"
        id="copyStatus"
        aria-live="polite"
    ></div>

</div>

            </article>
        `;

        const copyButton =
    document.getElementById("copyWhatsAppButton");

const copyStatus =
    document.getElementById("copyStatus");


if (copyButton) {

    copyButton.addEventListener("click", async function () {

        const gelaran =
            latest.jantina === "Perempuan"
                ? "Allahyarhamah"
                : "Allahyarham";

        const nama =
            latest.nama || "-";

        const tarikhMeninggal =
            formatDate(latest.tarikhMeninggal);

        const tarikhSolat =
            formatDate(latest.tarikhSolat);

        const masaSolat =
            latest.masaSolat || "-";

        const tempatSolat =
            latest.tempatSolat || "-";

        const tempatPengebumian =
            latest.tempatPengebumian || "-";

        const generatedMessage = `*BERITA KEMATIAN*

إنا لله وإنا إليه راجعون

Dukacita dimaklumkan bahawa ${gelaran}

*${nama}*

${umur ? `Berumur ${umur}\n` : ""}telah kembali ke rahmatullah pada
*${tarikhMeninggal}${latest.masaMeninggal ? `, jam ${latest.masaMeninggal}` : ""}*

*Maklumat Solat Jenazah*
📅 Tarikh: ${tarikhSolat}
🕐 Masa: ${masaSolat}
🕌 Tempat: ${tempatSolat}

${latest.tempatPengebumian ? `📍 *Tempat Pengebumian*\n${tempatPengebumian}\n\n` : ""}Semoga Allah SWT mengampuni dan merahmati ${gelaran}, serta menempatkannya dalam kalangan orang-orang yang beriman.

Masjid Ar-Rahmah Sarikei`;

        /*
        Use the approved text from Apps Script when available.
        Otherwise use the locally generated version above.
        */
        const message =
            latest.teksHebahan && String(latest.teksHebahan).trim()
                ? String(latest.teksHebahan).trim()
                : generatedMessage;

        async function copyText(textToCopy) {

            /*
            navigator.clipboard normally requires HTTPS/localhost.
            When this page is opened using file://, use a fallback.
            */
            if (
                navigator.clipboard &&
                window.isSecureContext
            ) {
                await navigator.clipboard.writeText(textToCopy);
                return true;
            }

            const textarea =
                document.createElement("textarea");

            textarea.value = textToCopy;
            textarea.setAttribute("readonly", "");
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            textarea.style.pointerEvents = "none";

            document.body.appendChild(textarea);

            textarea.focus();
            textarea.select();
            textarea.setSelectionRange(
                0,
                textarea.value.length
            );

            const copied =
                document.execCommand("copy");

            document.body.removeChild(textarea);

            return copied;
        }

        try {

            const copied =
                await copyText(message);

            if (!copied) {
                throw new Error("Copy command failed.");
            }

            copyStatus.textContent =
                "✓ Teks hebahan telah disalin.";

            setTimeout(() => {
                copyStatus.textContent = "";
            }, 3000);

        } catch (error) {

            console.error(error);

            copyStatus.textContent =
                "Teks tidak dapat disalin. Sila cuba selepas website diterbitkan.";
        }

    });

}

    } catch (error) {

        console.error(error);

        element.innerHTML = `
            <p style="text-align:center;color:#9B1C1C;">
                Maklumat berita kematian tidak dapat dimuatkan
                buat masa ini.
            </p>
        `;
    }
}

loadKematian();

</script>


<script>
const mobileMoreButton = document.getElementById("mobileMoreButton");
const mobileMoreMenu = document.getElementById("mobileMoreMenu");

mobileMoreButton.addEventListener("click", () => {
    const isOpen = mobileMoreMenu.classList.toggle("open");
    mobileMoreButton.setAttribute("aria-expanded", isOpen);
});

document.addEventListener("click", (event) => {
    const clickedInsideMenu = mobileMoreMenu.contains(event.target);
    const clickedButton = mobileMoreButton.contains(event.target);

    if (!clickedInsideMenu && !clickedButton) {
        mobileMoreMenu.classList.remove("open");
        mobileMoreButton.setAttribute("aria-expanded", "false");
    }
});
</script>

</body>
</html>
